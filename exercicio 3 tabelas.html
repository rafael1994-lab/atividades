<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tabelas</title>
	<style>
		table, th, td, tr{
			border:1px solid black;
			border-collapse: collapse;
			padding: 8px;
		}
		th{
			background-color: lightblue;
		}
		body{
			background-color: lightcyan;
		}
		td{
			background-color
		}
	</style>
</head>
<body>

	<h1>Tabelas</h1>

	<table>
		<tr>
			<th>Curso</th>
			<th>Nome</th>
			<th>Nota</th>
		</tr>

		<tr>
			<th rowspan="3">Curso de T.i</th>
			<td>Alice</td>
			<td>9.5</td>
		</tr>
		<tr>
			<td>Bruno</td>
			<td>5.0</td>

		</tr>

		<tr>
			<td>Claudia</td>
			<td>8.0</td>

		</tr>

		

	</table>

</body>
</html>
