<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tabelas</title>
	<style>
		table, th, td, tr{
			border:1px solid black;
			border-collapse: collapse;
			padding: 8px;
		}
		th{
			background-color: lightblue;
		}

	</style>
</head>
<body>
<h1>Tabelas</h1>

<table>
	
	<tr>
		<th colspan="3">Contrato Empresarial</th>
	</tr>
	<tr>
		<td>Empresa</td>
		<td>Contato</td>
		<td>Valo do contrato</td>

	</tr>
	<tr>
		<td>Fiat</td>
		<td>Ana</td>
		<td>R$ 1bi</td>

	</tr>


</table>
</body>
</html>
