<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
    <style>
        #titulogeral{
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>
</head>
<body>
    <h1 id="titulogeral" class "titulogeral">Envie uma mensagem peenchendo o formulario abaixo</h1>
    <br><br>

    <form action="">
    <label for="">Nome</label>
    <input type="text" id="nome" class="nome">

    <br><br>
    <label for="contato">Telefone</label>
    <input type="tel" id="contato" class="contao" name="contato">


    <br><br>
    <label for="email">Email</label>
    <input type="email" id="email" class="email">


    <br><br>
    <label for="option">Deseja receber nossas novidades?</label><input type="radio" name="novidades" value="sim">Sim <label>
        <input type="radio" name="novidades" value="não">Não
    </label>


<br><br>
    <label for="mensagem">Sua mensagem</label>
    <textarea name="mensagem" id="mensagem" rows="5" cols="40" placeholder="Mensagem"></textarea><br><br>


    <input type="submit" value="Enviar">

  </form>
</body>
</html>
