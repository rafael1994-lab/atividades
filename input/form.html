<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        @layer{
            *{
                margin: 0;
            }
        }
        .botao{
            background-color: antiquewhite;
            border-radius: 8px;
            border-width: 4px;
            padding: 8px;
            font-size: 20px;
        }

        input[type="text"]{
            border-radius: 8px;
            border-color: rgb(93, 0, 112);
            font-size: 15px;
            background-color: aliceblue;
        }
        select{
            border-radius: 8px;
            border-color: rebeccapurple;
            padding: 8px;
        }
        label{
            font-size: 17px;
        }
        body{
            background-repeat: no-repeat;
            background-size: cover;
            background-color: azure;
            margin: 0;
            min-height: 100vh;
            background-image: linear-gradient(to bottom, hsl(195, 7%, 89%) #7594fa);
            height: 100dvh;
    

        }
    </style>
<body>
    <h1>On-site Enquires Form</h1>
    <form action="https://sheetdb.io/api/v1/olupzyw42mzyo" method="post">
        <fieldset>
            <label for="nome">Nome</label>
            <input type="text" id="none" name="data[nome]">
    <br>
            <label for="sobrenome">Sobrenome</label>
            <input type="text" name="data[sobrenome]" id="sobrenome">
    <br>
            <label for="Estado">Estado</label>
            <select name="estado">
                <option value="MG">MG</option>
                <option value="MG">SP</option>
                <option value="MG">RJ</option>
                <option value="MG">BH</option>
            </select>
    <br>
            <label for="CPF">Cidade</label>
            <input type="text" name="data[cpf]" id="cpf">
    <br>
            <input class="botao" type='submit' name="data[botão]" id="botão" value="Enviar Dados">
        </fieldset>    
    







    </form>
</body>
</html>
