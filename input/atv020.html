<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
    <style>
        #titulogeral{
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>
</head>
<body>
    <h1 id="titulogeral" class "titulogeral">ATV020.HTML</h1>
    <br><br>

    <form action="">
    <label for="">Nome</label>
    <input type="text" id="nome" class="nome">

    <br><br>
    <label for="senha">Idade</label>
    <input type="idade" id="idade" class="idade">

    <br><br>
    <label for="senha">Senha</label>
    <input type="password" id="senha" class="senha">
    <br><br>

    <fieldset>
            <legend>Sexo</legend>
            <input type="radio" id="fem" class="fem" value="fem" name="gen">
            <label for="fem">F:</label>
            
        
            <input type="radio" id="fem" class="fem" value="fem" name="gen">
            <label for="fem">M:</label>
            
            

        </fieldset>

            <fieldset>
            <legend>Estado Civil</legend>
            <input type="radio" id="fem" class="fem" value="fem" name="gen">
            <label for="fem">Casado:</label>
            
        
            <input type="radio" id="fem" class="fem" value="fem" name="gen">
            <label for="fem">Enrolado:</label>
            

            <input type="radio" id="fem" class="fem" value="fem" name="gen">
            <label for="fem">Solteiro:</label>
            

        </fieldset>


         <fieldset>
            <legend>Comida Favorita</legend>
            <input type="radio" id="macarrao" class="macarrao" value="macarrao" name="Comida">
            <label for="fem">Macarrão:</label>
            <br><br>
            
        
            <input type="radio" id="Frango" class="frango" value="frango" name="Comida">
            <label for="fem">Frango:</label>
                        

        </fieldset>


    <label for="arquivo">Selecione seu Arquivo</label>
    <input type="file" id="arquivo" class="arquivo" name="arquivo" accept=".pdf, .png, .jpg">
    <br><br>
    <label for="cor">Selecione uma cor</label>
    <input type="color" id="cor" class="cor" name="cor">
    <br><br>
    <label for="hora_curta">Selecione uma Data</label>
    <input type="time" id="hora_curta" class="hora_curta">
    <br><br>
    <label for="email">Email</label>
    <input type="email" id="email" class="email">
    <br><br>
    <label for="numero">Número</label>
    <input type="number" id="numero" name="numero">
    <br><br>
    <input type="range" id="range" name="range">
    <br><br>
    <label for="data">Selecione uma Data:</label>
    <input type="date" id="data" name="data">
    <br><br>
    <label for="data_hora_local">Seleciona uma data e horas:</label>
    <input type="datetime-local" id="datetime-local" name="datetime-local">
    <br><br>
    <label for="horario">Selecione um Horário</label>
    <input form="time" id="horario" name="horario">
    <br><br>
    <label for="semana">Selecione uma semana</label>
    <input type="week" id="semana" name="semana">
    <br><br>
    <label for="mes">Selecione um mês</label>
    <input type="month" id="mes" name="mes">
    <br><br>
    <label for="mensagem">Mensagem</label>
    <textarea name="mensagem" id="mensagem" rows="5" cols="30" placeholder="Caixa de texto com 5 linhas e 30 colunas"></textarea><br><br>
    <br><br>
    <select name="cor_select" id="cor_select" name="cor_select">
        <option value="Vermelho">Vermelho</option>
        <option value="Azul">Azul</option>
        <option value="Verde">Verde</option>
    </select>  
    <label for="url">URL</label>
    <input type="url" id="url" class="url" name="url">
    <BR><BR>
    <input type="submit" value="Enviar">
    <input type="reset" value="Rdefinir">
 




 </form>
</body>
</html>
